# The two groups section 2a of build.sh creates with groupadd, declared the way
# systemd wants them declared.
#
# groupadd has to stay: the 1Password RPM expects both groups to exist before
# it installs, and this file is not read until boot. But groupadd writes them
# into this image's /etc/group and nowhere else, and "bootc container lint"
# flags exactly that - "found /etc/group entry without corresponding systemd
# sysusers.d". /etc is per-deployment and merged on every update, so a group
# that lives only there is a group a future merge can drop, taking 1Password's
# permissions with it. systemd-sysusers recreates these from here on every
# boot, which is the durable half.
#
# "-" for the GID: let systemd allocate. Nothing here depends on a fixed one.
g onepassword -
g onepassword-mcp -
