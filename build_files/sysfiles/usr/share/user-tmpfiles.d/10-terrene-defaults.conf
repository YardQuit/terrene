# Per-account defaults, applied at every login for every account.
#
# These are user tmpfiles.d rules: the systemd user manager runs
# systemd-tmpfiles-setup.service as each account logs in, with %h as its home.
# That reaches accounts that already exist when the image is switched to,
# which /etc/skel never does - skel only seeds accounts created afterwards.
# Both rules only ever create; neither replaces anything already there.
#
# The Ao palette for Ptyxis. Ptyxis loads palettes from the account's own
# ~/.local/share/org.gnome.Ptyxis/palettes/ and nowhere else on disk, so the
# image's copy is linked in there. A link rather than a copy, so an updated
# palette in a new image reaches every account. An ao.palette already in
# that directory - an account's own, or an older /etc/skel copy - is left
# alone; delete it to pick the image's up at the next login.
L %h/.local/share/org.gnome.Ptyxis/palettes/ao.palette - - - - /usr/share/terrene/ptyxis/ao.palette

# COSMIC Initial Setup runs at a session's first login until this file
# exists. The installer has already set up the account, language, keyboard
# and network, so skip it. Run "cosmic-initial-setup" by hand to see it anyway.
f %h/.config/cosmic-initial-setup-done - - - -
