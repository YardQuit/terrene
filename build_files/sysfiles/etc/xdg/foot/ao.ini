# Terrene default: the Ao colours (https://github.com/YardQuit/ao).
#
# Pulled into /etc/xdg/foot/foot.ini by an include= line that build.sh
# adds; foot reads that file only when the account has no
# ~/.config/foot/foot.ini of its own.

[colors-dark]
foreground=dadada
background=080d15
cursor=080d15 ff9000
selection-foreground=dadada
selection-background=7533bd
urls=ff9000

regular0=0d1117
regular1=fa7970
regular2=81be83
regular3=ffba00
regular4=45b1e8
regular5=d2a8ff
regular6=a2d2fb
regular7=dadada

bright0=0d1117
bright1=fa7970
bright2=81be83
bright3=ffba00
bright4=45b1e8
bright5=d2a8ff
bright6=a2d2fb
bright7=dadada
