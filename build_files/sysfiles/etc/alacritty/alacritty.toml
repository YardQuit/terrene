# Terrene default: the Ao colours (https://github.com/YardQuit/ao).
#
# Alacritty reads this only when the account has no alacritty.toml of its
# own under ~/.config; a personal one replaces this file entirely.

[colors.footer_bar]
foreground = "#c0c5ce"
background = "#080d15"

[colors.cursor]
cursor = "0xffffff"
text = "0x000000"

[colors.normal]
black = "#0d1117"
blue = "#45b1e8"
cyan = "#a2d2fb"
green = "#81be83"
magenta = "#d2a8ff"
red = "#fa7970"
white = "#dadada"
yellow = "#ffba00"

[colors.bright]
black = "#0d1117"
blue = "#45b1e8"
cyan = "#2c5484"
green = "#81be83"
magenta = "#d2a8ff"
red = "#fa7970"
white = "#dadada"
yellow = "#ffba00"

[colors.primary]
background = "#080d15"
bright_foreground = "#c0c5ce"
foreground = "#dadada"

[colors.selection]
text = "0x505050"

[colors.search.matches]
foreground = "CellForeground"
background = "#4c1785"

[colors.search.focused_match]
foreground = "#f3f4f6"
background = "#9d5800"

[colors.vi_mode_cursor]
cursor = "#ef2929"
text = "#f5f5f5"
